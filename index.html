<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jonas – 100 CSS Questions</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1b2333;--mu:#667085;--bd:#dfe3ec;--pr:#3b5bdb;--ok:#2f9e44;--no:#e03131;--okbg:#e6f6ea;--nobg:#fdeaea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--card:#1b2030;--tx:#e8ecf5;--mu:#98a2b8;--bd:#2c3348;--pr:#7b93ff;--okbg:#17321f;--nobg:#3a1a1a}}
:root[data-theme="dark"]{--bg:#12151c;--card:#1b2030;--tx:#e8ecf5;--mu:#98a2b8;--bd:#2c3348;--pr:#7b93ff;--okbg:#17321f;--nobg:#3a1a1a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
.wrap{max-width:820px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px;margin-bottom:14px}
h1{font-size:1.5rem;margin:0 0 6px}
.mu{color:var(--mu)}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:10px 16px}
button.p{background:var(--pr);border-color:var(--pr);color:#fff;font-weight:600}
button:disabled{opacity:.4;cursor:default}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 16px;margin-bottom:14px}
.bar{height:6px;background:var(--bd);border-radius:6px;overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--pr);width:0}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.timer.low{color:var(--no)}
.q{font-size:1.1rem;font-weight:600;margin:6px 0 16px}
.opt{display:flex;gap:10px;width:100%;text-align:left;margin-bottom:10px;padding:12px 14px}
.opt b{min-width:22px;color:var(--mu)}
.opt.sel{border-color:var(--pr);box-shadow:0 0 0 2px var(--pr) inset}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.no{background:var(--nobg);border-color:var(--no)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.grid button{padding:6px 0;font-size:.85rem}
.grid .ans{background:var(--pr);color:#fff;border-color:var(--pr)}
.grid .cur{outline:2px solid var(--tx)}
.grid .ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.grid .no{background:var(--no);color:#fff;border-color:var(--no)}
.score{font-size:3rem;font-weight:800;margin:4px 0}
.tag{display:inline-block;font-size:.75rem;padding:2px 10px;border-radius:20px;background:var(--bd);color:var(--mu);margin-bottom:6px}
.hide{display:none}
.rev{border-top:1px solid var(--bd);padding-top:12px;margin-top:12px}
</style>
</head>
<body>
<div class="wrap">
 <div id="start" class="card">
  <h1>Jonas – 100 CSS Questions</h1>
  <p class="mu">Client–Server Scripts: CSS, JavaScript &amp; the DOM</p>
  <p>100 multiple-choice questions · 100 minutes · one correct answer each. Answer choices are shuffled every attempt.</p>
  <button class="p" onclick="startExam()">Start Exam</button>
 </div>
 <div id="exam" class="hide">
  <div class="top"><span id="cnt">1/100</span><div class="bar"><i id="prog"></i></div><span class="timer" id="timer">100:00</span></div>
  <div class="card"><span class="tag" id="tag"></span><div class="q" id="q"></div><div id="opts"></div>
   <div class="nav"><button id="prev" onclick="go(-1)">← Previous</button><button id="next" onclick="go(1)">Next →</button></div></div>
  <div class="card"><div class="grid" id="grid"></div><div class="nav" style="margin-top:14px"><span class="mu" id="left"></span><button class="p" onclick="finish(false)">Submit Exam</button></div></div>
 </div>
 <div id="res" class="hide">
  <div class="card"><div class="mu">Your score</div><div class="score" id="score"></div><div id="verdict"></div>
   <div class="nav" style="justify-content:flex-start;margin-top:14px"><button class="p" onclick="startExam()">Retake</button></div></div>
  <div class="card"><b>Review</b><div class="grid" id="rgrid" style="margin-top:10px"></div><div id="review"></div></div>
 </div>
</div>
<script>
// [question, CORRECT answer, wrong, wrong, wrong]  (options are shuffled at runtime)
const BANK=[
// ---- CSS ----
["What does CSS stand for?","Cascading Style Sheets","Computer Style Sheets","Creative Style System","Colorful Style Sheets"],
["CSS is a stylesheet language used to describe the ______ of an HTML or XML document.","presentation","database","encryption","compilation"],
["A CSS style rule is made of a selector and a ______.","declaration block","function body","event handler","script tag"],
["A declaration block is enclosed in:","curly braces { }","parentheses ( )","square brackets [ ]","angle brackets < >"],
["Multiple declarations inside a declaration block are separated by:","semicolons","commas","colons","periods"],
["In a declaration, the property name and its value are separated by:","a colon","a semicolon","an equals sign","a comma"],
["In the declaration color: red; the word 'color' is the:","property","value","selector","tag"],
["In the declaration color: red; the word 'red' is the:","value","property","selector","rule set"],
["Which symbol represents the universal selector?","*","#",".","&"],
["The universal selector is used to:","apply styles to all elements on a page","select only one unique element","select only elements with a class","select only the body tag"],
["Which symbol is used to write a class selector?",". (dot)","# (hash)","* (asterisk)",": (colon)"],
["Which symbol is used to write an ID selector?","# (hash)",". (dot)","* (asterisk)","@ (at sign)"],
["Which statement about ID selectors is correct?","Each ID must be unique within the document","An ID can be reused on any number of elements","IDs must always be numeric","IDs are written with a dot"],
["Which selector targets a single, unique element on a page?","ID selector","Universal selector","Grouping selector","Type selector for all tags"],
["Which character separates selectors in a grouping selector (e.g., h1, h2, p)?","comma","semicolon","plus sign","colon"],
["A grouping selector is used to:","apply the same style definition to several elements","apply a style to one ID only","override inline styles","link an external file"],
["In how many ways can CSS be added to an HTML document (as covered in the chapter)?","3","2","4","5"],
["Which are the three ways of adding CSS to a web page?","Inline, internal, external","Inline, inner, outer","Local, global, remote","Head, body, footer"],
["Inline CSS is written using which HTML attribute?","style","class","id","css"],
["Internal CSS is placed inside which element?","<style>","<link>","<script>","<css>"],
["Where is an internal style sheet normally placed?","In the <head> section","At the end of the <body> only","Inside a <p> tag","In a separate .js file"],
["External CSS is linked to a page using which element?","<link>","<style>","<script>","<css>"],
["Which file extension is used for an external style sheet?",".css",".js",".html",".style"],
["Which is the correct way to link an external style sheet?","<link href=\"style.css\" rel=\"stylesheet\" type=\"text/css\">","<style src=\"style.css\"></style>","<script href=\"style.css\"><\/script>","<css link=\"style.css\">"],
["Which style type has the HIGHEST priority?","Inline style","Internal style","External style","They all have equal priority"],
["Which style type has the LOWEST priority?","External style sheet","Internal style sheet","Inline style","Browser alert style"],
["A rule defined in <style>...</style> tags will override a rule in:","an external style sheet","an inline style","both inline and external","none of the above"],
["Which is a major advantage of external style sheets?","One file can style many web pages","They must be edited on every page","They are the only type that supports colors","They load faster than any script"],
["Which is a disadvantage of inline styles?","Each inline style must be edited separately for a design change","They cannot change colors","They need a .css file","They apply to the whole site automatically"],
["Which CSS rule changes the color of all <p> elements to red?","p { color: red; }","p.color = red;","<p color=\"red\">","#p { red: color; }"],
["Which selector would style every <img> element on a page?","img","#img",".img","*img"],
["Which CSS rule styles the element with id=\"header\"?","#header { color: blue; }",".header { color: blue; }","header# { color: blue; }","*header { color: blue; }"],
["Which CSS rule styles all elements with class=\"menu\"?",".menu { color: blue; }","#menu { color: blue; }","menu. { color: blue; }","*menu { color: blue; }"],
["Which is NOT something CSS is used for?","Querying a database","Setting text color and size","Choosing a background image","Controlling page layout"],
["A key problem CSS solves in web design is that a web page has no internal ______ system for positioning elements.","x-y coordinate","database","encryption","compiler"],
["Which HTML tag pair is used to write internal style rules?","<style></style>","<css></css>","<script><\/script>","<link></link>"],
["The type attribute value normally used with the <style> tag is:","text/css","text/javascript","text/html","application/json"],
["Which technology is mainly used for client-side scripting to make pages interactive?","JavaScript","PHP","SQL","Oracle"],
// ---- JavaScript ----
["JavaScript is best described as a:","scripting language","markup language","stylesheet language","database language"],
["JavaScript code is NOT compiled; it appears as ______ in an HTML file.","ASCII text","machine code","binary files","bytecode only"],
["JavaScript is a ______ language.","case-sensitive","case-insensitive","non-scripting","server-only"],
["Which statement about JavaScript is TRUE?","It is open and cross-platform","It runs only on Windows","It cannot be used with HTML","It requires a compiler before use"],
["Which tag is used to insert JavaScript into an HTML page?","<script>","<js>","<javascript>","<code>"],
["JavaScript code is placed between:","<script> and <\/script>","<js> and </js>","<style> and </style>","<code> and </code>"],
["External JavaScript files use which file extension?",".js",".java",".script",".css"],
["An external JavaScript file should NOT contain:","the <script> tag","function definitions","alert statements","variable declarations"],
["Which attribute of <script> is used to include an external JavaScript file?","src","href","link","file"],
["Which is the correct way to include an external file named myjs.js?","<script src=\"myjs.js\"><\/script>","<script href=\"myjs.js\"><\/script>","<link src=\"myjs.js\">","<js name=\"myjs.js\"></js>"],
["JavaScript can be placed in:","head, body, or an external file","only in the head","only in the body","only in an external file"],
["Which method writes output to the HTML document while the page is being built?","document.write()","console.read()","window.input()","document.listen()"],
["Which command writes a string to the page followed by a newline?","document.writeln()","document.read()","window.print()","document.prompt()"],
["Which of these displays a pop-up dialog box?","window.alert()","document.writeln()","innerHTML","console.log()"],
["An alert box stops script execution until the user:","clicks OK","refreshes the page","closes the browser","types a message"],
["Which JavaScript output method writes into the browser console?","console.log()","document.alert()","window.write()","innerHTML()"],
["Which of the following is NOT a JavaScript output method?","document.read()","innerHTML","document.write()","window.alert()"],
["Which property is used to output content into an HTML element?","innerHTML","outerWrite","textTag","insertAlert"],
["What does alert('Hello World!'); do?","Shows a dialog box with the text Hello World!","Prints to the console only","Writes to the HTML file on disk","Creates a new variable"],
["Which code prints 'Hello World!' on the page?","document.writeln('Hello World!');","print('Hello World!');","echo 'Hello World!';","console.page('Hello World!');"],
["In JavaScript, a function is:","a block of code executed when it is called","a type of HTML tag","a CSS property","a database table"],
["Which keyword introduces a function in JavaScript?","function","def","func","method"],
["Which is the correct JavaScript function syntax?","function myFunction() { /* code */ }","function = myFunction() { }","myFunction function() { }","def myFunction() { }"],
["The code inside a function is executed when:","the function is called","the page is saved","the browser starts","the function is declared"],
["Values passed to a function when it is called are known as:","arguments (parameters)","selectors","declarations","tags"],
["Multiple arguments passed to a function are separated by:","commas","semicolons","colons","periods"],
["Each function should ideally perform:","a single task","every task in the program","only output tasks","no tasks"],
["Which keyword is used to declare a variable in the chapter's examples?","var","dim","int","declare"],
["The purpose of a variable is to:","store information for later use","style an element","link a file","create a page border"],
["When declaring a variable in JavaScript, you:","do not specify its data type","must specify int or string first","must use a semicolon after the name","must write it in capitals"],
["Which is a valid JavaScript variable name?","_total","2total","my total","total-sum"],
["Variable names must start with:","a letter or underscore","a number","a space","a punctuation mark"],
["Which variable name is INVALID?","my name","myName","_name","name1"],
["A variable name cannot be the same as a:","JavaScript keyword","previous page","function body","comment"],
["After declaring var carname; the variable:","is empty (has no value yet)","contains the string \"carname\"","contains 0","causes an error"],
["Which statement assigns the value \"Volvo\" to carname?","carname=\"Volvo\";","carname==\"Volvo\";","carname:\"Volvo\";","carname<-\"Volvo\";"],
["Which statement declares and assigns in one step?","var carname=\"Volvo\";","carname var=\"Volvo\";","var=\"Volvo\" carname;","declare carname=\"Volvo\";"],
["Which statement declares many variables in one statement?","var name=\"Doe\", age=30, job=\"carpenter\";","var name=\"Doe\"; age=30; job=\"carpenter\" var;","var(name,age,job);","var name+age+job;"],
["In JavaScript, the variables 'Age' and 'age' are:","different variables","the same variable","an error","automatically merged"],
["Which check validates a password shorter than 8 characters?","if (password.length < 8)","if (password < 8.length)","if (length(password) > 8)","if (password.size == 8)"],
["Which code alerts \"your password is not strong\" for a short password?","if (pw.length < 8) { alert(\"your password is not strong\"); }","if (pw.length > 8) { alert(\"your password is not strong\"); }","alert(pw.length < 8);","document.pw(\"your password is not strong\");"],
["Checking user input in the browser before sending it to the server is called:","client-side validation","server-side rendering","database indexing","cookie hashing"],
["Which is an application of client-side JavaScript?","Form validation","Compiling C programs","Hosting a database","Routing server packets"],
["JavaScript helps in manipulating HTML pages by:","adding and deleting HTML elements dynamically","only changing the server config","compiling HTML to binary","encrypting CSS files"],
["Enabling dynamic creation and manipulation of page content is an example of:","dynamic content","server hosting","database backup","file compression"],
["Adding animations, tooltips and drag-and-drop to a page is a:","user interface enhancement","back-end task","database task","network task"],
["Client-side scripts can store data on the user's device using:","cookies and local storage","server logs only","SQL tables only","email attachments"],
["JavaScript can raise dynamic pop-ups to give visitors:","user notifications","server backups","database tables","compiled code"],
["Which JavaScript technique loads back-end data while other processing continues?","Ajax","CSS grouping","Inline styling","Document headers"],
["Which JavaScript library is used to visualize data and prepare charts?","D3.js","MySQL","Sybase","Oracle"],
// ---- DOM ----
["DOM stands for:","Document Object Model","Data Object Method","Document Order Mode","Digital Output Model"],
["The DOM is a programming interface for:","HTML and XML documents","image files only","databases only","operating systems"],
["The DOM represents a document as a:","tree-like structure","flat table","single text line","stack of images"],
["The DOM tree starts with which object?","document","window.alert","body.text","console"],
["In the DOM, each element of a document is represented as a(n):","object with properties and methods","plain comment","CSS file","database row"],
["Which can be represented as nodes in the DOM?","Elements, text nodes and comments","Only images","Only CSS rules","Only scripts"],
["The DOM allows programs to dynamically access and update a page's:","content, structure and style","hardware drivers","server database","operating system"],
["Which action is possible through the DOM?","Adding or removing elements","Rewriting the browser source code","Changing the web server's CPU","Installing an operating system"],
["Using the DOM, a developer can respond to:","events triggered by user actions","only server errors","only database queries","nothing at runtime"],
["Which statement about the DOM is correct?","It is widely supported by modern browsers","It works only in one browser","It is a programming language","It can only read, not change, a page"],
["The DOM is essential in web development because it enables:","dynamic and interactive web pages","only static pages","server hardware control","compilation of CSS"],
["Which JavaScript method is commonly used to get an element through its id?","document.getElementById()","document.findClass()","window.getId()","document.selectAll.id()"]
];
const $=id=>document.getElementById(id),L='ABCD';
const SEC=n=>n<38?'CSS':n<88?'JavaScript':'DOM';
let Q,ans,cur,left,tm;
function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startExam(){
 Q=BANK.map((b,n)=>({q:b[0],ok:b[1],o:shuf(b.slice(1)),s:SEC(n)}));
 ans=Array(Q.length).fill(null);cur=0;left=100*60;
 ['start','res'].forEach(i=>$(i).classList.add('hide'));$('exam').classList.remove('hide');
 clearInterval(tm);tick();tm=setInterval(tick,1000);draw();window.scrollTo(0,0)}
function tick(){const m=Math.floor(left/60),s=left%60;$('timer').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');$('timer').classList.toggle('low',left<300);if(left--<=0)finish(true)}
function draw(){
 const x=Q[cur];$('cnt').textContent=(cur+1)+'/'+Q.length;$('prog').style.width=ans.filter(a=>a!=null).length/Q.length*100+'%';
 $('tag').textContent=x.s;$('q').textContent=(cur+1)+'. '+x.q;
 $('opts').innerHTML='';x.o.forEach((t,i)=>{const b=document.createElement('button');b.className='opt'+(ans[cur]===i?' sel':'');b.innerHTML='<b>'+L[i]+'.</b><span></span>';b.lastChild.textContent=t;b.onclick=()=>{ans[cur]=i;draw()};$('opts').appendChild(b)});
 $('prev').disabled=cur==0;$('next').disabled=cur==Q.length-1;
 $('grid').innerHTML='';Q.forEach((_,i)=>{const b=document.createElement('button');b.textContent=i+1;b.className=(ans[i]!=null?'ans ':'')+(i==cur?'cur':'');b.onclick=()=>{cur=i;draw()};$('grid').appendChild(b)});
 $('left').textContent=ans.filter(a=>a==null).length+' unanswered'}
function go(d){cur+=d;draw();window.scrollTo(0,0)}
function finish(auto){
 const un=ans.filter(a=>a==null).length;
 if(!auto&&!confirm(un?'You have '+un+' unanswered question(s). Submit anyway?':'Submit your exam?'))return;
 clearInterval(tm);let sc=0;Q.forEach((x,i)=>{if(ans[i]!=null&&x.o[ans[i]]===x.ok)sc++});
 const pct=Math.round(sc/Q.length*100);
 $('score').textContent=sc+' / '+Q.length+' ('+pct+'%)';
 $('verdict').innerHTML=pct>=50?'<b style="color:var(--ok)">Pass</b> — pass mark is 50%.':'<b style="color:var(--no)">Not yet passed</b> — pass mark is 50%. Review the answers below and retake.';
 $('exam').classList.add('hide');$('res').classList.remove('hide');
 $('rgrid').innerHTML='';$('review').innerHTML='';
 Q.forEach((x,i)=>{const good=ans[i]!=null&&x.o[ans[i]]===x.ok;
  const g=document.createElement('button');g.textContent=i+1;g.className=good?'ok':'no';g.onclick=()=>$('r'+i).scrollIntoView({behavior:'smooth'});$('rgrid').appendChild(g);
  const d=document.createElement('div');d.className='rev';d.id='r'+i;
  const h=document.createElement('div');h.className='q';h.textContent=(i+1)+'. '+x.q;d.appendChild(h);
  x.o.forEach((t,k)=>{const p=document.createElement('div');p.className='opt '+(t===x.ok?'ok':ans[i]===k?'no':'');p.style.cursor='default';p.innerHTML='<b>'+L[k]+'.</b><span></span>';p.lastChild.textContent=t+(t===x.ok?'  ✔':ans[i]===k?'  ✘ (your answer)':'');d.appendChild(p)});
  if(ans[i]==null){const n=document.createElement('div');n.className='mu';n.textContent='Not answered';d.appendChild(n)}
  $('review').appendChild(d)});
 window.scrollTo(0,0)}
</script>
</body>
</html>
